<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aviy</title>
<style>
:root{font-family:system-ui,sans-serif;color-scheme:light dark}
body{max-width:900px;margin:3rem auto;padding:0 1.2rem;line-height:1.6}
main{border:1px solid #8886;border-radius:14px;padding:1.5rem}
input,button{font:inherit;padding:.7rem;margin:.3rem 0}
input{width:min(100%,35rem)}
button{cursor:pointer}
:focus-visible{outline:3px solid #2685e8;outline-offset:3px}
</style>
</head>
<body>
<main>
<h1>Aviy</h1>
<p>Local intelligence platform</p>
<label for="token">API bearer token</label><br>
<input id="token" type="password" autocomplete="off">
<button id="check" type="button">Check API status</button>
<pre id="result" role="status" aria-live="polite">Ready.</pre>
</main>
<script>
const token=document.getElementById("token");
const result=document.getElementById("result");
document.getElementById("check").addEventListener("click",async()=>{
 result.textContent="Checking...";
 try{
  const response=await fetch("/v1/status",{
   headers:{Authorization:"Bearer "+token.value}
  });
  result.textContent=JSON.stringify(await response.json(),null,2);
 }catch(error){result.textContent="Request failed: "+error.message;}
});
</script>
</body>
</html>
