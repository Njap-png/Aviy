[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aviy"
version = "0.1.0"
description = "Independent evolving AI ecosystem"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
dependencies = [
    "pydantic>=2.7,<3",
    "PyYAML>=6,<7",
    "typer>=0.12,<1",
    "fastapi>=0.110,<1",
    "uvicorn>=0.29,<1",
    "numpy>=1.26,<3",
    "torch>=2.4,<3"
]

[project.optional-dependencies]
scientific = ["scipy>=1.12,<2", "sympy>=1.12,<2"]

dev = [
    "pytest>=8,<9",
    "ruff>=0.5,<1",
    "pyright>=1.1,<2"
]

[tool.setuptools.packages.find]
include = ["aviy*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"
